services:
  - type: web
    plan: free
    name: student-attendance-frontend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn frontend_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Deploy the backend FIRST, then paste its live URL here
      # (e.g. https://student-attendance-backend.onrender.com/api).
      # Render will prompt you for this value when you create the Blueprint.
      - key: BASE_API_URL
        sync: false
