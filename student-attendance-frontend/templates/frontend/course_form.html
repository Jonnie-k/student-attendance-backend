{% extends "frontend/base.html" %}

{% block title %}
{% if course %}Edit Course{% else %}Add Course{% endif %}
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-info text-white py-3">

                    <h3 class="mb-0">
                        <i class="bi bi-book-half me-2"></i>

                        {% if course %}
                            Edit Course
                        {% else %}
                            Add Course
                        {% endif %}
                    </h3>

                </div>

                <div class="card-body p-4">

                    {% if error %}
                        <div class="alert alert-danger">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Course Name
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="course_name"
                                    class="form-control"
                                    placeholder="Enter course name"
                                    value="{{ course.course_name|default:'' }}"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Course Code
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="text"
                                    name="course_code"
                                    class="form-control"
                                    placeholder="Enter course code"
                                    value="{{ course.course_code|default:'' }}"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Teacher
                                <span class="text-danger">*</span>
                            </label>

                            <select
                                name="teacher"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Teacher
                                </option>

                                {% for teacher in teachers %}

                                    <option
                                        value="{{ teacher.id }}"
                                        {% if course.teacher|stringformat:"s" == teacher.id|stringformat:"s" %}selected{% endif %}
                                    >
                                        {{ teacher.full_name|default:teacher.username }}
                                    </option>

                                {% endfor %}

                            </select>

                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between">

                            <a
                                href="{% url 'courses' %}"
                                class="btn btn-outline-secondary btn-lg"
                            >
                                <i class="bi bi-arrow-left-circle me-2"></i>
                                Cancel
                            </a>

                            <button
                                class="btn btn-success btn-lg"
                                type="submit"
                            >

                                <i class="bi bi-check-circle-fill me-2"></i>

                                {% if course %}
                                    Update Course
                                {% else %}
                                    Save Course
                                {% endif %}

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
